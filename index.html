<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    height: 100vh;
    background: linear-gradient(120deg, #ff7b7b, #ffb3b3);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ANIMAÇÃO */
@keyframes aparecer {
    from {
        opacity: 0;
        transform: scale(0.8) translateY(30px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

/* Caixa */
.card {
    width: 340px;
    padding: 30px;
    border-radius: 20px;
    backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    text-align: center;
    color: white;

    animation: aparecer 0.8s ease;
}

/* Avatar */
.avatar {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.7);
    margin: 0 auto 15px;
}

/* Texto */
h2 {
    font-weight: 400;
    margin-bottom: 10px;
}

p {
    font-size: 13px;
    opacity: 0.9;
    margin-bottom: 20px;
}

/* Inputs */
.input {
    margin-bottom: 15px;
}

.input input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    outline: none;
}

/* Opções */
.options {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 20px;
}

/* Botão */
button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(90deg, #ff4d4d, #ff9999);
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
}

/* Link */
.link {
    margin-top: 15px;
    font-size: 13px;
}
</style>

</head>

<body>

<div class="card">

    <div class="avatar"></div>

    <h2>Bem-vindo</h2>
    <p>Entre para continuar</p>

    <form>
        <div class="input">
            <input type="text" placeholder="Usuário ou Email">
        </div>

        <div class="input">
            <input type="password" placeholder="Senha">
        </div>

        <div class="options">
            <label><input type="checkbox"> Lembrar</label>
            <a href="#" style="color:white;">Esqueceu?</a>
        </div>

        <button>Entrar</button>
    </form>

    <div class="link">
        Criar conta
    </div>

</div>

</body>
</html>
