<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(120deg, #ff7b7b, #ffb3b3);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 340px;
      padding: 30px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      text-align: center;
      color: white;
      animation: aparecer 0.8s ease;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: scale(0.8) translateY(30px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    h2 {
      margin-bottom: 8px;
      font-weight: bold;
    }

    p {
      font-size: 13px;
      opacity: 0.9;
      margin-bottom: 20px;
    }

    .input {
      margin-bottom: 15px;
    }

    .input input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(90deg, #ff4d4d, #ff9999);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .link {
      margin-top: 15px;
      font-size: 13px;
    }

    .link a {
      color: white;
      font-weight: bold;
      text-decoration: none;
    }

    .link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Bem-vindo</h2>
    <p>Faça login para continuar</p>

    <form onsubmit="fazerLogin(event)">
      <div class="input">
        <input type="email" id="email" placeholder="Digite seu email" required>
      </div>

      <div class="input">
        <input type="password" id="senha" placeholder="Digite sua senha" required>
      </div>

      <button type="submit">Entrar</button>
    </form>

    <div class="link">
      <p>Não tem conta? <a href="cadastro.html">Criar conta</a></p>
    </div>
  </div>

  <script>
    function fazerLogin(event) {
      event.preventDefault();

      let emailDigitado = document.getElementById("email").value;
      let senhaDigitada = document.getElementById("senha").value;

      let emailSalvo = localStorage.getItem("email");
      let senhaSalva = localStorage.getItem("senha");

      if (emailDigitado === emailSalvo && senhaDigitada === senhaSalva) {
        alert("Login feito com sucesso!");
        window.location.href = "home.html";
      } else {
        alert("Email ou senha incorretos!");
      }
    }
  </script>

</body>
</html>
