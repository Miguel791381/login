<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(120deg, #ff7b7b, #ffb3b3);
    }

    .card {
      width: 380px;
      padding: 35px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      text-align: center;
      color: white;
      box-shadow: 0px 8px 20px rgba(0,0,0,0.3);
      animation: aparecer 0.8s ease;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: scale(0.9) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    p {
      margin-top: 10px;
      font-size: 14px;
      opacity: 0.9;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #ff4d4d, #ff9999);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Bem-vindo!</h1>
    <p>Você entrou no sistema com sucesso 😄</p>

    <button onclick="window.location.href='index.html'">
      Sair
    </button>
  </div>

</body>
</html>
