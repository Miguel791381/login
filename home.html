<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home - Curso de Edição</title>

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
      color:white;
    }

    header{
      padding: 30px;
      text-align: center;
      background: #111;
      border-bottom: 2px solid #00ff99;
    }

    header h1{
      margin:0;
      font-size: 32px;
      color: #00ff99;
    }

    header p{
      margin-top: 8px;
      color: #ccc;
      font-size: 16px;
    }

    .container{
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
    }

    .card{
      background: rgba(255,255,255,0.05);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0px 0px 20px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .card h2{
      text-align: center;
      margin-bottom: 25px;
      font-size: 26px;
    }

    .modulo-btn{
      display:block;
      padding: 18px;
      margin: 15px 0;
      text-align:center;
      font-size: 20px;
      font-weight:bold;
      background: #00ff99;
      color:black;
      border-radius: 14px;
      text-decoration:none;
      transition: 0.3s;
    }

    .modulo-btn:hover{
      transform: scale(1.03);
      background: #00cc77;
    }

    .logout{
      display:block;
      margin-top: 25px;
      text-align:center;
      padding: 14px;
      border-radius: 14px;
      background: #ff4444;
      color:white;
      font-weight:bold;
      text-decoration:none;
      transition: 0.3s;
    }

    .logout:hover{
      background: #cc0000;
      transform: scale(1.03);
    }

    footer{
      text-align:center;
      padding: 25px;
      color:#777;
      font-size:14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Curso de Edição</h1>
    <p>Aprenda do zero ao avançado</p>
  </header>

  <!-- 🔥 PARTE DE VENDA DO CURSO -->
  <div class="container">
    <div class="card">

      <h2>Meu Curso Completo</h2>
      <p>Aprenda do zero ao avançado e comece a editar vídeos profissionais.</p>

      <a href="https://pay.kiwify.com.br/seu-produto" target="_blank"
      style="display:block;
      margin-top:20px;
      padding:18px;
      text-align:center;
      background:#00ff99;
      color:black;
      font-weight:bold;
      border-radius:14px;
      text-decoration:none;">
        🔥 Comprar agora (PIX ou Cartão)
      </a>

    </div>
  </div>

  <!-- 📚 MÓDULOS DO CURSO -->
  <div class="container">
    <div class="card">


</body>
</html>
